<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" preserveAspectRatio="none">
  <!-- Own aged-paper texture (not the original image): warm centre, darker edges, fine grain. -->
  <defs>
    <linearGradient id="h" x1="0" x2="1">
      <stop offset="0" stop-color="#d6bf95"/>
      <stop offset="0.012" stop-color="#dcc69c"/>
      <stop offset="0.04" stop-color="#ead6ac"/>
      <stop offset="0.08" stop-color="#f1dfb8"/>
      <stop offset="0.13" stop-color="#f5e5c5"/>
      <stop offset="0.21" stop-color="#f5e9d0"/>
      <stop offset="0.32" stop-color="#f7eed8"/>
      <stop offset="0.5" stop-color="#faf1d9"/>
      <stop offset="0.68" stop-color="#faf0dd"/>
      <stop offset="0.8" stop-color="#f6ead1"/>
      <stop offset="0.87" stop-color="#f3e5c5"/>
      <stop offset="0.92" stop-color="#efddb8"/>
      <stop offset="0.96" stop-color="#e6d0a6"/>
      <stop offset="0.98" stop-color="#d9c398"/>
      <stop offset="1" stop-color="#d6bf96"/>
    </linearGradient>
    <radialGradient id="v" cx="0.5" cy="0.42" r="0.72">
      <stop offset="0.7" stop-color="#b08a50" stop-opacity="0"/>
      <stop offset="1" stop-color="#b08a50" stop-opacity="0.22"/>
    </radialGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix values="0 0 0 0 0.45  0 0 0 0 0.33  0 0 0 0 0.16  0.22 0 0 0 -0.07"/>
    </filter>
  </defs>
  <rect width="390" height="844" fill="url(#h)"/>
  <rect width="390" height="844" fill="url(#v)"/>
  <rect width="390" height="844" filter="url(#grain)"/>
</svg>
